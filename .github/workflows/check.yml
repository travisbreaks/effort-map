name: check

# Build, confirm the committed generated files are current, run the portable checks,
# and package. No secrets and no deploy: this is a public repository, and deploys
# run from the owner's machine with a locally held token.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build
        run: node scripts/build.mjs
      - name: Generated files are committed and current
        run: git diff --exit-code -- site/index.html docs/ROUTING.md
      - name: Portable checks
        run: node scripts/check.mjs
      - name: Package for deploy
        run: node scripts/package.mjs
